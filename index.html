<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pursuing Coding 连接 C++ 与 Java 两个在线学习工具。">
  <meta name="theme-color" content="#f5f7f2">
  <title>Pursuing Coding</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f7f2;
      --ink: #15202b;
      --muted: #607080;
      --line: rgba(21, 32, 43, 0.14);
      --panel: rgba(255, 255, 255, 0.82);
      --panel-strong: #ffffff;
      --blue: #2764d8;
      --teal: #1f8f78;
      --amber: #b36b16;
      --rose: #b23a48;
      --shadow: 0 18px 48px rgba(32, 44, 58, 0.12);
      --radius: 8px;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC",
        "Source Han Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      font-family: var(--font-sans);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background: #f5f7f2;
      overflow-x: hidden;
      font-family: var(--font-sans);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a,
    button {
      font: inherit;
    }

    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #f5f7f2;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(28px, 5vw, 72px);
    }

    .corner-brand {
      position: fixed;
      top: clamp(20px, 3vw, 34px);
      left: clamp(20px, 4vw, 52px);
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: rgba(21, 32, 43, 0.82);
      text-decoration: none;
      font-size: 16px;
      font-weight: 560;
      letter-spacing: 0;
    }

    .corner-brand-mark {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, rgba(39, 100, 216, 0.94), rgba(31, 143, 120, 0.94));
      box-shadow: 0 10px 24px rgba(31, 143, 120, 0.18);
      font-size: 13px;
      font-weight: 720;
    }

    .signature {
      position: fixed;
      right: clamp(20px, 3vw, 36px);
      bottom: clamp(16px, 3vw, 30px);
      z-index: 2;
      margin: 0;
      color: rgba(21, 32, 43, 0.36);
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .hero {
      width: min(920px, 100%);
      min-width: 0;
    }

    .course-board {
      position: relative;
      min-width: 0;
      display: grid;
      gap: 16px;
    }

    .course-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(18px, 2.6vw, 28px);
    }

    .course-card {
      position: relative;
      min-height: 310px;
      padding: clamp(22px, 2.6vw, 28px);
      border: 1px solid rgba(21, 32, 43, 0.12);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-content: start;
      gap: 20px;
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease,
        background 180ms ease;
    }

    .course-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background:
        linear-gradient(135deg, var(--accent), transparent 46%),
        repeating-linear-gradient(
          90deg,
          rgba(21, 32, 43, 0.15) 0,
          rgba(21, 32, 43, 0.15) 1px,
          transparent 1px,
          transparent 18px
        );
      pointer-events: none;
    }

    .course-card:hover,
    .course-card:focus-visible {
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--accent), transparent 30%);
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 28px 70px rgba(32, 44, 58, 0.18);
      outline: none;
    }

    .course-card.cpp {
      --accent: var(--blue);
    }

    .course-card.java {
      --accent: var(--amber);
    }

    .course-top,
    .course-body,
    .course-tags {
      position: relative;
      z-index: 1;
    }

    .course-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .language-badge {
      width: 58px;
      height: 58px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--accent);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0;
      box-shadow: 0 12px 28px color-mix(in srgb, var(--accent), transparent 68%);
    }

    .external-mark {
      width: 34px;
      height: 34px;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 62%);
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.72);
    }

    .external-mark svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }

    .course-body {
      display: grid;
      align-content: center;
      gap: 12px;
    }

    .course-body h2 {
      margin: 0;
      max-width: 9em;
      font-size: clamp(27px, 3vw, 36px);
      font-weight: 640;
      line-height: 1.14;
      letter-spacing: 0;
    }

    .course-body p {
      max-width: 15.5em;
      margin: 0;
      color: #4b5e70;
      font-size: clamp(14px, 1.45vw, 17px);
      font-weight: 400;
      line-height: 1.78;
    }

    .course-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 7px 11px;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 66%);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.64);
      color: #495c70;
      font-size: 13px;
      line-height: 1.2;
    }

    @media (max-width: 980px) {
      .course-grid {
        grid-template-columns: 1fr;
      }

      .course-card {
        min-height: 300px;
      }
    }

    @media (max-width: 640px) {
      .page {
        padding: 76px 20px 28px;
      }

      .corner-brand {
        top: 20px;
        left: 20px;
      }

      .signature {
        right: 20px;
        bottom: 16px;
        font-size: 11px;
      }

      .course-card {
        min-height: 285px;
        padding: 18px;
      }

      .language-badge {
        width: 58px;
        height: 58px;
        font-size: 18px;
      }

      .course-body h2 {
        font-size: clamp(28px, 7.4vw, 31px);
      }

      .course-body p {
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .course-card {
        transition: none;
      }

      .course-card:hover,
      .course-card:focus-visible {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <canvas class="scene" id="scene" aria-hidden="true"></canvas>

  <a class="corner-brand" href="./" aria-label="Pursuing Coding 首页">
    <span class="corner-brand-mark">PC</span>
    <span>Pursuing Coding</span>
  </a>
  <p class="signature">Developed by WJH</p>

  <div class="page">
    <main class="hero">
      <section class="course-board" aria-label="课程入口">
        <div class="course-grid">
          <a class="course-card cpp" href="https://pursuing-coding.github.io/cpp-learn/" target="_blank" rel="noreferrer">
            <div class="course-top">
              <span class="language-badge">C++</span>
              <span class="external-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M7 17 17 7"></path>
                  <path d="M9 7h8v8"></path>
                </svg>
              </span>
            </div>
            <div class="course-body">
              <h2>C++ 在线实验室</h2>
              <p>从编译模型、类型系统到 STL 与现代 C++，进入完整的浏览器课程实验室。</p>
            </div>
            <div class="course-tags" aria-label="C++ 课程标签">
              <span class="tag">12 章</span>
              <span class="tag">代码练习</span>
              <span class="tag">在线运行</span>
            </div>
          </a>

          <a class="course-card java" href="https://pursuing-coding.github.io/java-path/" target="_blank" rel="noreferrer">
            <div class="course-top">
              <span class="language-badge">JAVA</span>
              <span class="external-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M7 17 17 7"></path>
                  <path d="M9 7h8v8"></path>
                </svg>
              </span>
            </div>
            <div class="course-body">
              <h2>Java 学习路径</h2>
              <p>按 Level 推进 Java 基础、工程实践、后端框架与综合练习，适合长期闯关学习。</p>
            </div>
            <div class="course-tags" aria-label="Java 课程标签">
              <span class="tag">13 Level</span>
              <span class="tag">104 关</span>
              <span class="tag">学习路径</span>
            </div>
          </a>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById("scene");
      var context = canvas.getContext("2d");
      var mediaQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      var tokens = [
        "int main()",
        "std::vector",
        "class Main",
        "public static",
        "template<T>",
        "JVM",
        "RAII",
        "OOP",
        "interface",
        "lambda",
        "STL",
        "generics"
      ];
      var points = [];
      var width = 0;
      var height = 0;
      var pointer = { x: 0, y: 0 };
      var animationFrame = 0;
      var isDrawing = false;

      function resize() {
        var ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        createPoints();
        if (!isDrawing) {
          draw();
        }
      }

      function createPoints() {
        var count = Math.max(34, Math.floor((width * height) / 28000));
        points = Array.from({ length: count }, function (_, index) {
          return {
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.22,
            vy: (Math.random() - 0.5) * 0.22,
            token: tokens[index % tokens.length],
            tone: index % 4
          };
        });
      }

      function draw() {
        isDrawing = true;
        context.clearRect(0, 0, width, height);
        context.fillStyle = "#f5f7f2";
        context.fillRect(0, 0, width, height);

        context.save();
        context.globalAlpha = 0.38;
        context.strokeStyle = "rgba(21, 32, 43, 0.08)";
        context.lineWidth = 1;
        var grid = 54;
        var offsetX = (pointer.x - width / 2) * 0.012;
        var offsetY = (pointer.y - height / 2) * 0.012;

        for (var x = -grid; x < width + grid; x += grid) {
          context.beginPath();
          context.moveTo(x + offsetX, 0);
          context.lineTo(x + offsetX, height);
          context.stroke();
        }
        for (var y = -grid; y < height + grid; y += grid) {
          context.beginPath();
          context.moveTo(0, y + offsetY);
          context.lineTo(width, y + offsetY);
          context.stroke();
        }
        context.restore();

        for (var i = 0; i < points.length; i += 1) {
          var point = points[i];
          if (!mediaQuery.matches) {
            point.x += point.vx;
            point.y += point.vy;
            if (point.x < -80) point.x = width + 80;
            if (point.x > width + 80) point.x = -80;
            if (point.y < -40) point.y = height + 40;
            if (point.y > height + 40) point.y = -40;
          }

          var hue = ["39, 100, 216", "31, 143, 120", "179, 107, 22", "178, 58, 72"][point.tone];
          context.fillStyle = "rgba(" + hue + ", 0.12)";
          context.beginPath();
          context.arc(point.x, point.y, 3.5, 0, Math.PI * 2);
          context.fill();

          context.font = "12px Consolas, 'Cascadia Code', monospace";
          context.fillStyle = "rgba(" + hue + ", 0.18)";
          context.fillText(point.token, point.x + 10, point.y + 4);

          for (var j = i + 1; j < points.length; j += 1) {
            var other = points[j];
            var dx = point.x - other.x;
            var dy = point.y - other.y;
            var distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              context.strokeStyle = "rgba(21, 32, 43, " + (0.09 * (1 - distance / 150)) + ")";
              context.beginPath();
              context.moveTo(point.x, point.y);
              context.lineTo(other.x, other.y);
              context.stroke();
            }
          }
        }

        if (!mediaQuery.matches) {
          animationFrame = window.requestAnimationFrame(draw);
        } else {
          isDrawing = false;
        }
      }

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", function (event) {
        pointer.x = event.clientX;
        pointer.y = event.clientY;
      }, { passive: true });

      resize();

      mediaQuery.addEventListener("change", function () {
        window.cancelAnimationFrame(animationFrame);
        isDrawing = false;
        draw();
      });
    }());
  </script>
</body>
</html>
