<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pursuing Coding 提供 C++、Java、Python 和 C# 的交互式编程课程。">
  <meta name="theme-color" content="#f5f7f2">
  <title>Pursuing Coding</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f7f2;
      --ink: #15202b;
      --muted: #607080;
      --line: rgba(21, 32, 43, 0.14);
      --panel: rgba(255, 255, 255, 0.82);
      --blue: #2764d8;
      --teal: #1f8f78;
      --amber: #b36b16;
      --rose: #b23a48;
      --radius: 8px;
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Noto Sans SC",
        "Source Han Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      font-family: var(--font-sans);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100svh;
      margin: 0;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background: #f5f7f2;
      overflow-x: hidden;
      font-family: var(--font-sans);
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    a,
    button {
      font: inherit;
    }

    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #f5f7f2;
    }

    .page {
      position: relative;
      z-index: 1;
      flex: 1;
      display: grid;
      align-items: center;
      min-width: 0;
      padding-block: clamp(14px, 4svh, 38px);
    }

    .corner-brand {
      position: relative;
      align-self: flex-start;
      margin: clamp(16px, 3vw, 32px) clamp(20px, 4vw, 52px) 0;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: rgba(21, 32, 43, 0.82);
      text-decoration: none;
      font-size: 16px;
      font-weight: 560;
      letter-spacing: 0;
    }

    .corner-brand-mark {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, rgba(39, 100, 216, 0.94), rgba(31, 143, 120, 0.94));
      box-shadow: 0 10px 24px rgba(31, 143, 120, 0.18);
      font-size: 13px;
      font-weight: 720;
    }

    .signature {
      position: relative;
      align-self: flex-end;
      z-index: 2;
      margin: 0 clamp(20px, 3vw, 36px) clamp(16px, 3vw, 30px);
      color: #607080;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .hero {
      --gutter: clamp(16px, 4vw, 56px);
      width: min(100%, 1520px);
      min-width: 0;
      margin-inline: auto;
    }

    .course-board {
      min-width: 0;
    }

    .board-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(12px, 2.4vw, 26px);
      margin: 2px var(--gutter) 0;
    }

    .board-nav[hidden] {
      display: none;
    }

    .board-arrow {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: var(--panel);
      cursor: pointer;
    }

    .board-arrow:hover {
      background: #fff;
      border-color: var(--muted);
    }

    .course-positions {
      display: flex;
      align-items: center;
    }

    .course-position {
      display: grid;
      place-items: center;
      padding: 0;
      width: 28px;
      height: 44px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #84928e;
      cursor: pointer;
    }

    .course-position::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 5px;
      background: currentColor;
    }

    .course-position[aria-current="true"] {
      color: var(--ink);
    }

    .course-position[aria-current="true"]::before {
      width: 18px;
    }

    .board-nav button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .board-nav svg {
      width: 18px;
      height: 18px;
    }

    .course-grid {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: min(416px, 80%);
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding-inline: var(--gutter);
      padding: 20px var(--gutter) 28px;
    }

    .course-grid.is-carousel {
      grid-auto-flow: row;
      grid-template-columns: minmax(0, 1fr);
      grid-auto-columns: auto;
      gap: 0;
      overflow: clip;
      scroll-snap-type: none;
      perspective: 1100px;
      perspective-origin: 50% 48%;
      overscroll-behavior-inline: contain;
      touch-action: pan-y pinch-zoom;
      user-select: none;
    }

    .is-carousel .course-card {
      width: min(416px, calc(100% - clamp(40px, 10vw, 80px)));
      grid-area: 1 / 1;
      justify-self: center;
      cursor: grab;
    }

    .is-carousel .course-card.is-current {
      cursor: pointer;
    }

    .is-carousel.is-dragging .course-card {
      cursor: grabbing;
    }

    .is-carousel .course-card:not(.is-current) .external-mark {
      visibility: hidden;
    }

    @media (max-width: 640px) {
      .course-grid.is-carousel {
        padding-inline: 0;
      }

      .is-carousel .course-card {
        width: min(416px, calc(100% - clamp(74px, 21vw, 132px)));
      }
    }

    .course-card {
      position: relative;
      min-width: 0;
      min-height: clamp(246px, 47svh, 350px);
      padding: clamp(18px, 2.2vw, 28px);
      scroll-snap-align: start;
      border: 1px solid rgba(21, 32, 43, 0.12);
      border-radius: 14px;
      background: var(--panel);
      color: var(--ink);
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(32, 44, 58, 0.09);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-content: start;
      gap: clamp(14px, 2.8svh, 26px);
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .course-card::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background:
        linear-gradient(135deg, var(--accent), transparent 46%),
        repeating-linear-gradient(
          90deg,
          rgba(21, 32, 43, 0.15) 0,
          rgba(21, 32, 43, 0.15) 1px,
          transparent 1px,
          transparent 18px
        );
      pointer-events: none;
    }

    .course-card.is-current,
    .course-card:focus-visible {
      border-color: color-mix(in srgb, var(--accent), transparent 30%);
      background: #fff;
      box-shadow: 0 9px 18px rgba(32, 44, 58, 0.14);
    }

    .course-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .course-card.cpp {
      --accent: var(--blue);
    }

    .course-card.java {
      --accent: var(--amber);
    }

    .course-card.python {
      --accent: var(--teal);
    }

    .course-card.csharp {
      --accent: var(--rose);
    }

    .course-top,
    .course-body,
    .course-tags {
      position: relative;
      z-index: 1;
    }

    .course-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .language-badge {
      width: 50px;
      height: 50px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--accent);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0;
      box-shadow: 0 12px 28px color-mix(in srgb, var(--accent), transparent 68%);
    }

    .external-mark {
      width: 34px;
      height: 34px;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 62%);
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: var(--accent);
      background: rgba(255, 255, 255, 0.72);
    }

    .external-mark svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }

    .course-body {
      display: grid;
      align-content: center;
      gap: 12px;
    }

    .course-body h2 {
      margin: 0;
      max-width: 9em;
      font-size: clamp(23px, 2.35vw, 34px);
      font-weight: 640;
      line-height: 1.14;
      letter-spacing: 0;
    }

    .course-body p {
      max-width: 20em;
      margin: 0;
      color: #4b5e70;
      font-size: clamp(14px, 1.2vw, 16px);
      font-weight: 400;
      line-height: 1.78;
    }

    .course-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 7px 11px;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 66%);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.64);
      color: #495c70;
      font-size: 13px;
      line-height: 1.2;
    }

    @media (max-width: 600px) {
      .course-body {
        gap: 8px;
      }

      .tag {
        padding: 5px 8px;
        font-size: 12px;
      }
    }

    @media (max-height: 520px) {
      .course-grid {
        padding-block: 12px 15px;
      }

      .course-card {
        min-height: 208px;
        padding-block: 14px;
        gap: 10px;
      }

      .language-badge {
        width: 40px;
        height: 40px;
      }

      .course-body {
        gap: 5px;
      }

      .course-body p {
        line-height: 1.5;
      }

      .signature {
        margin-bottom: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .course-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <canvas class="scene" id="scene" aria-hidden="true"></canvas>

  <a class="corner-brand" href="./" aria-label="Pursuing Coding 首页">
    <span class="corner-brand-mark">PC</span>
    <span>Pursuing Coding</span>
  </a>

  <div class="page">
    <main class="hero">
      <section class="course-board" aria-label="课程">
        <div class="course-grid" id="course-grid">
          <a class="course-card cpp" href="https://pursuing-coding.github.io/cpp-learn/" target="_blank" rel="noreferrer">
            <div class="course-top">
              <span class="language-badge">C++</span>
              <span class="external-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M7 17 17 7"></path>
                  <path d="M9 7h8v8"></path>
                </svg>
              </span>
            </div>
            <div class="course-body">
              <h2>C++ 在线实验室</h2>
              <p>从编译模型和类型系统入手，练习 STL、内存管理和现代 C++。</p>
            </div>
            <div class="course-tags" aria-label="C++ 课程标签">
              <span class="tag">13 章</span>
              <span class="tag">代码练习</span>
              <span class="tag">在线运行</span>
            </div>
          </a>

          <a class="course-card java" href="https://pursuing-coding.github.io/java-path/" target="_blank" rel="noreferrer">
            <div class="course-top">
              <span class="language-badge">Java</span>
              <span class="external-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                  <path d="M7 17 17 7"></path>
                  <path d="M9 7h8v8"></path>
                </svg>
              </span>
            </div>
            <div class="course-body">
              <h2>Java 学习路径</h2>
              <p>从基础语法到工程实践，逐关学习 Java 和后端框架。</p>
            </div>
            <div class="course-tags" aria-label="Java 课程标签">
              <span class="tag">13 个阶段</span>
              <span class="tag">104 关</span>
              <span class="tag">学习路径</span>
            </div>
          </a>

          <a class="course-card python" href="https://pursuing-coding.github.io/python-learn/" target="_blank" rel="noreferrer">
            <div class="course-top">
              <span class="language-badge">Py</span>
              <span class="external-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 17 17 7"></path><path d="M9 7h8v8"></path></svg>
              </span>
            </div>
            <div class="course-body">
              <h2>Python 在线实验室</h2>
              <p>从基础语法和集合起步，练习文件处理、自动化测试与综合项目。</p>
            </div>
            <div class="course-tags" aria-label="Python 课程标签">
              <span class="tag">33 章</span>
              <span class="tag">5 个阶段</span>
              <span class="tag">在线运行</span>
            </div>
          </a>

          <a class="course-card csharp" href="https://pursuing-coding.github.io/c-sharp-learn/" target="_blank" rel="noreferrer">
            <div class="course-top">
              <span class="language-badge">C#</span>
              <span class="external-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M7 17 17 7"></path><path d="M9 7h8v8"></path></svg>
              </span>
            </div>
            <div class="course-body">
              <h2>C# 闯关学习</h2>
              <p>通过浏览器中的控制台练习学习循环、集合和面向对象，逐步完成小项目。</p>
            </div>
            <div class="course-tags" aria-label="C# 课程标签">
              <span class="tag">34 关</span>
              <span class="tag">6 个阶段</span>
              <span class="tag">浏览器模拟</span>
            </div>
          </a>
        </div>
        <div class="board-nav" id="course-nav" role="group" aria-label="切换课程" hidden>
          <button class="board-arrow" id="course-prev" type="button" aria-label="上一门课程" aria-controls="course-grid">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
          </button>
          <div class="course-positions" id="course-positions"></div>
          <button class="board-arrow" id="course-next" type="button" aria-label="下一门课程" aria-controls="course-grid">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </div>
      </section>
    </main>
  </div>
  <footer class="signature">Developed by WJH</footer>

  <script>
    (() => {
      const rail = document.querySelector("#course-grid");
      const nav = document.querySelector("#course-nav");
      const positions = document.querySelector("#course-positions");
      const cards = [...rail.querySelectorAll(".course-card")];
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
      const turn = 2 * Math.PI / cards.length;
      const wrap = index => (index % cards.length + cards.length) % cards.length;
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      let position = 0;
      let target = 0;
      let velocity = 0;
      let radius;
      let stepWidth;
      let frame = 0;
      let frameTime = 0;
      let wheelTimer = 0;
      let wheelStart = null;
      let drag = null;
      let suppressClick = false;

      const buttons = cards.map((card, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "course-position";
        button.setAttribute("aria-label", card.querySelector("h2").textContent);
        button.addEventListener("click", () => select(index));
        positions.append(button);
        return button;
      });

      function render() {
        for (const [index, card] of cards.entries()) {
          const angle = (index - position) * turn;
          const side = Math.sin(angle);
          const depth = (1 - Math.cos(angle)) / 2;
          card.style.transform = `translate3d(${radius * side}px, ${8 * depth}px, ${-210 * depth}px)
            rotateY(${22 * side}deg) scale(${1 - 0.25 * depth})`;
          card.style.opacity = 1 - 0.48 * depth;
          card.style.zIndex = Math.round(100 * (1 - depth));
          card.style.pointerEvents = depth > 0.84 ? "none" : "";
        }
      }

      function measure() {
        const width = cards[0].offsetWidth;
        radius = width * 0.82;
        stepWidth = Math.min(width * 0.78, 285);
        render();
      }

      function markCurrent() {
        const active = wrap(target);
        cards.forEach((card, index) => {
          card.classList.toggle("is-current", index === active);
          card.tabIndex = index === active ? 0 : -1;
          buttons[index].setAttribute("aria-current", String(active === index));
        });
      }

      function stop() {
        cancelAnimationFrame(frame);
        frame = 0;
        frameTime = 0;
        velocity = 0;
      }

      function animate(now) {
        const elapsed = frameTime ? clamp((now - frameTime) / 1000, 0, 0.035) : 1 / 60;
        frameTime = now;
        const steps = Math.max(1, Math.ceil(elapsed / (1 / 120)));
        const dt = elapsed / steps;
        for (let step = 0; step < steps; step++) {
          // A damped spring gives the front card a small overshoot as it settles.
          velocity += ((target - position) * 180 - velocity * 20) * dt;
          position += velocity * dt;
        }
        if (Math.abs(position - target) < 0.001 && Math.abs(velocity) < 0.012) {
          stop();
          position = target = wrap(target);
        } else {
          frame = requestAnimationFrame(animate);
        }
        render();
      }

      function clearWheel() {
        clearTimeout(wheelTimer);
        wheelStart = null;
      }

      function goTo(next, impulse = 0) {
        clearWheel();
        target = next;
        markCurrent();
        if (reducedMotion.matches) {
          stop();
          position = target = wrap(target);
          render();
          return;
        }
        velocity = clamp(velocity + impulse, -5, 5);
        if (!frame) frame = requestAnimationFrame(animate);
      }

      function select(index) {
        const closest = index + Math.round((position - index) / cards.length) * cards.length;
        goTo(closest);
      }

      function move(direction) {
        goTo((wheelStart === null ? target : Math.round(position)) + direction);
      }

      function releaseFrom(start, impulse = 0) {
        const travel = position - start;
        const base = Math.round(start);
        let next = Math.round(position + clamp(impulse * 0.09, -0.35, 0.35));
        if (next === base && Math.abs(travel) > 0.2) next += Math.sign(travel);
        goTo(next, impulse);
      }

      document.querySelector("#course-prev").addEventListener("click", () => move(-1));
      document.querySelector("#course-next").addEventListener("click", () => move(1));

      rail.closest(".course-board").addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key === "ArrowLeft") move(-1);
        else if (event.key === "ArrowRight") move(1);
        else if (event.key === "Home") select(0);
        else if (event.key === "End") select(cards.length - 1);
        else return;
        event.preventDefault();
        if (cards.includes(event.target)) cards[wrap(target)].focus({ preventScroll: true });
      });

      rail.addEventListener("wheel", event => {
        if (event.ctrlKey || event.metaKey || drag?.moved || Math.abs(event.deltaX) < Math.max(1, Math.abs(event.deltaY))) return;
        event.preventDefault();
        if (wheelStart === null) {
          stop();
          wheelStart = position;
        }
        const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? rail.clientWidth : 1;
        position += clamp(event.deltaX * unit / stepWidth, -0.7, 0.7);
        if (!reducedMotion.matches) render();
        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => releaseFrom(wheelStart), 110);
      }, { passive: false });

      rail.addEventListener("pointerdown", event => {
        if (!event.isPrimary || event.button !== 0 || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        suppressClick = false;
        drag = { id: event.pointerId, x: event.clientX, y: event.clientY, lastX: event.clientX, time: event.timeStamp, speed: 0, moved: false };
      });

      rail.addEventListener("pointermove", event => {
        if (drag?.id !== event.pointerId) return;
        const distance = event.clientX - drag.x;
        if (!drag.moved) {
          if (Math.abs(distance) < Math.max(7, Math.abs(event.clientY - drag.y))) return;
          stop();
          clearWheel();
          drag.start = position;
          drag.moved = true;
          rail.classList.add("is-dragging");
          rail.setPointerCapture(event.pointerId);
        }
        const dt = Math.max(12, event.timeStamp - drag.time);
        drag.speed = drag.speed * 0.35 + (drag.lastX - event.clientX) / stepWidth * (650 / dt);
        drag.lastX = event.clientX;
        drag.time = event.timeStamp;
        position = drag.start - distance / stepWidth;
        if (!reducedMotion.matches) render();
      });

      function endDrag(event) {
        if (drag?.id !== event.pointerId) return;
        if (drag.moved) {
          suppressClick = true;
          rail.classList.remove("is-dragging");
          const impulse = event.type === "pointerup" && event.timeStamp - drag.time < 95 ? drag.speed : 0;
          releaseFrom(drag.start, impulse);
        }
        drag = null;
      }

      window.addEventListener("pointerup", endDrag);
      window.addEventListener("pointercancel", endDrag);
      rail.addEventListener("lostpointercapture", endDrag);
      rail.addEventListener("dragstart", event => event.preventDefault());
      rail.addEventListener("click", event => {
        if (suppressClick && event.detail > 0) {
          event.preventDefault();
          suppressClick = false;
          return;
        }
        const card = event.target.closest(".course-card");
        if (!card || card.classList.contains("is-current") || event.detail === 0 ||
            event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
        event.preventDefault();
        select(cards.indexOf(card));
      });

      reducedMotion.addEventListener("change", () => goTo(target));
      rail.classList.add("is-carousel");
      nav.hidden = false;
      markCurrent();
      measure();
      new ResizeObserver(measure).observe(rail);
    })();

    (function () {
      var canvas = document.getElementById("scene");
      var context = canvas.getContext("2d");
      if (!context) return;
      var mediaQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      var tokens = [
        "int main()",
        "std::vector",
        "class Main",
        "public static",
        "template<T>",
        "JVM",
        "RAII",
        "OOP",
        "interface",
        "lambda",
        "STL",
        "generics"
      ];
      var points = [];
      var width = 0;
      var height = 0;
      var pointer = { x: 0, y: 0 };
      var animationFrame = 0;
      var previousDraw = null;
      var frameInterval = 1000 / 30;
      function requestDraw() {
        if (!document.hidden && !animationFrame) {
          animationFrame = window.requestAnimationFrame(draw);
        }
      }

      function resize() {
        var ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        createPoints();
        previousDraw = null;
        requestDraw();
      }

      function createPoints() {
        var count = Math.min(80, Math.max(24, Math.floor((width * height) / 28000)));
        points = Array.from({ length: count }, function (_, index) {
          return {
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.22,
            vy: (Math.random() - 0.5) * 0.22,
            token: tokens[index % tokens.length],
            tone: index % 4
          };
        });
      }

      function draw(timestamp) {
        animationFrame = 0;
        var elapsed = previousDraw === null ? frameInterval : timestamp - previousDraw;
        if (!mediaQuery.matches && elapsed < frameInterval - 1) {
          requestDraw();
          return;
        }
        previousDraw = timestamp;
        var step = Math.min(elapsed, 50) / (1000 / 60);
        context.clearRect(0, 0, width, height);
        context.fillStyle = "#f5f7f2";
        context.fillRect(0, 0, width, height);

        context.save();
        context.globalAlpha = 0.38;
        context.strokeStyle = "rgba(21, 32, 43, 0.08)";
        context.lineWidth = 1;
        var grid = 54;
        var offsetX = (pointer.x - width / 2) * 0.012;
        var offsetY = (pointer.y - height / 2) * 0.012;

        for (var x = -grid; x < width + grid; x += grid) {
          context.beginPath();
          context.moveTo(x + offsetX, 0);
          context.lineTo(x + offsetX, height);
          context.stroke();
        }
        for (var y = -grid; y < height + grid; y += grid) {
          context.beginPath();
          context.moveTo(0, y + offsetY);
          context.lineTo(width, y + offsetY);
          context.stroke();
        }
        context.restore();

        for (var i = 0; i < points.length; i += 1) {
          var point = points[i];
          if (!mediaQuery.matches) {
            point.x += point.vx * step;
            point.y += point.vy * step;
            if (point.x < -80) point.x = width + 80;
            if (point.x > width + 80) point.x = -80;
            if (point.y < -40) point.y = height + 40;
            if (point.y > height + 40) point.y = -40;
          }

          var hue = ["39, 100, 216", "31, 143, 120", "179, 107, 22", "178, 58, 72"][point.tone];
          context.fillStyle = "rgba(" + hue + ", 0.12)";
          context.beginPath();
          context.arc(point.x, point.y, 3.5, 0, Math.PI * 2);
          context.fill();

          context.font = "12px Consolas, 'Cascadia Code', monospace";
          context.fillStyle = "rgba(" + hue + ", 0.18)";
          context.fillText(point.token, point.x + 10, point.y + 4);

          for (var j = i + 1; j < points.length; j += 1) {
            var other = points[j];
            var dx = point.x - other.x;
            var dy = point.y - other.y;
            var distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < 150) {
              context.strokeStyle = "rgba(21, 32, 43, " + (0.09 * (1 - distance / 150)) + ")";
              context.beginPath();
              context.moveTo(point.x, point.y);
              context.lineTo(other.x, other.y);
              context.stroke();
            }
          }
        }

        if (!mediaQuery.matches) requestDraw();
      }

      window.addEventListener("resize", resize);
      window.addEventListener("pointermove", function (event) {
        if (mediaQuery.matches) return;
        pointer.x = event.clientX;
        pointer.y = event.clientY;
      }, { passive: true });

      resize();

      mediaQuery.addEventListener("change", function () {
        previousDraw = null;
        requestDraw();
      });
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) {
          window.cancelAnimationFrame(animationFrame);
          animationFrame = 0;
          previousDraw = null;
        } else {
          requestDraw();
        }
      });
    }());
  </script>
</body>
</html>
